<!doctype html>
<html lang="pl" theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACC StatsToolKit</title>
<link rel="icon" href="favicon.png">
<style>
html {
  font-size: 16px;
  --lumo-font-family: RobotoMono, Consolas, 'Courier New', monospace;
  font-family: var(--lumo-font-family);
  --acc-h: 345;
  --lumo-base-color: hsl(0, 0%, 11%);
  --lumo-body-text-color: hsla(0, 0%, 100%, 0.9);
  --lumo-secondary-text-color: hsla(0, 0%, 100%, 0.65);
  --lumo-error-text-color: hsl(3, 90%, 63%);
  --lumo-contrast-5pct: hsla(0, 0%, 100%, 0.05);
  --lumo-contrast-10pct: hsla(0, 0%, 100%, 0.1);
  --lumo-contrast-20pct: hsla(0, 0%, 100%, 0.2);
  --lumo-contrast-30pct: hsla(0, 0%, 100%, 0.3);
  --lumo-primary-color: hsl(var(--acc-h), 85%, 39%);
  --lumo-primary-text-color: hsl(var(--acc-h), 95%, 62%);
  --lumo-primary-color-10pct: hsla(var(--acc-h), 92%, 45%, 0.16);
  --lumo-space-xs: 0.25rem;
  --lumo-space-s: 0.5rem;
  --lumo-space-m: 1rem;
  --lumo-space-l: 1.5rem;
  --lumo-font-size-xxs: 0.65rem;
  --lumo-font-size-xs: 0.75rem;
  --lumo-font-size-s: 0.875rem;
  --lumo-font-size-l: 1.125rem;
  --lumo-font-size-xl: 1.375rem;
  --lumo-border-radius-l: 0;
  --app-header-height: 0px;
}
@media (min-width: 1001px) {
  html { font-size: clamp(13px, min(100vw / 120, 100vh / 67.5), 40px); }
}
@font-face {
  font-family: RobotoMono;
  src: url(RobotoMono-VariableFont_wght.ttf);
}
body {
  margin: 0;
  min-height: 100vh;
  background: #232323 url(camo.svg) center / cover fixed;
  color: var(--lumo-body-text-color);
}
</style>
<!--VAADIN_ICONS-->
</head>
<body>
<stats-toolkit-route></stats-toolkit-route>
<script src="data.js"></script>
<script src="weapons.js"></script>
<script src="app.js"></script>
</body>
</html>
